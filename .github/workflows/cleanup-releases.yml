name: Cleanup Old Releases

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  id-token: write
  contents: write
  actions: write

jobs:
  cleanup-releases:
    uses: peavers-code/peavers-warcraft-workflows/.github/workflows/cleanup-releases.yml@master
    with:
      use_self_hosted: true
      # Downloads are sourced from GitHub for this addon, so each deleted
      # release's count has to be banked before it disappears.
      bank_downloads: true
      git_user_name: Chris Turner
      git_user_email: peavers@gmail.com
    secrets: inherit
